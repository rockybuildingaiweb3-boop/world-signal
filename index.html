<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Intelligence Dashboard — WORLD SIGNAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--paper:#fffdf7;--ink:#16130e;--muted:#6b655a;--line:#ddd6c6;--world:#0f4c4c;--ai:#8a3b12;--econ:#1d3a6e;--accent:#b91c1c;--chip:#efe9da;--card:#fff;--good:#166534;--good-bg:#dcfce7;--warn:#92400e;--warn-bg:#fef3c7;--low:#9a3412;--low-bg:#ffedd5;--bad:#991b1b;--bad-bg:#fee2e2;--shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0e0c;--paper:#171512;--ink:#f2ede3;--muted:#a8a195;--line:#2e2a24;--chip:#242019;--card:#1c1a17;--world:#5ec8c0;--ai:#f0a36a;--econ:#8db4ff;--good-bg:#14532d;--warn-bg:#451a03;--low-bg:#431407;--bad-bg:#450a0a;--shadow:0 1px 3px rgba(0,0,0,.4);--good:#4ade80;--warn:#fbbf24;--low:#fb923c;--bad:#f87171;--accent:#f87171}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55}
a{color:inherit}button,select,summary{min-height:40px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 56px}
.narrow{max-width:920px;margin-left:auto;margin-right:auto}
.mast{border-bottom:3px double var(--ink);padding:26px 0 16px}
.mast-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(38px,7vw,72px);line-height:.9;letter-spacing:-.02em;margin:10px 0 4px}
.brand span{color:var(--accent)}
.tagline{font-size:15px;color:var(--muted);max-width:760px}
.meta-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600}
.pill strong{color:var(--accent)}
/* Executive */
.exec{background:var(--ink);color:#f6f3ec;border-radius:16px;padding:26px;margin:28px 0 8px}
@media(prefers-color-scheme:dark){.exec{background:#1c1917;color:#f2ede3}}
html[data-theme="dark"] .exec{background:#1c1917;color:#f2ede3}
.exec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid rgba(128,128,128,.35);padding-bottom:12px;margin-bottom:18px}
.exec h2{margin:0;font-family:"Fraunces",serif;font-size:28px}
.exec-head p{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.exec-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.exec-grid{grid-template-columns:1fr}}
.exec-item{background:rgba(255,255,255,.08);border:1px solid rgba(128,128,128,.35);border-radius:12px;padding:16px 18px}
@media(prefers-color-scheme:dark){.exec-item{background:rgba(255,255,255,.06)}}
html[data-theme="dark"] .exec-item{background:rgba(255,255,255,.06)}
.exec-item .num{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#fca5a5}
@media(prefers-color-scheme:dark){.exec-item .num{color:#fca5a5}}
html[data-theme="dark"] .exec-item .num{color:#fca5a5}
.exec-item h3{margin:6px 0 6px;font-family:"Fraunces",serif;font-size:19px;line-height:1.2}
.exec-item p{margin:0;font-size:14.5px;line-height:1.55;opacity:.94}
.exec-item.watch-item{grid-column:1/-1}
.exec-item ul{margin:6px 0 0;padding-left:18px;font-size:14.5px}
.exec-item li{margin:3px 0}
/* Rules collapsible */
.rules{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:20px 0 0;font-size:13.5px}
.rules summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"Show ▾";font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
.rules[open ] summary::after{content:"Hide ▴"}
.rules .rules-body{padding:0 16px 14px}
.rules ul{margin:6px 0 0;padding-left:18px}.rules li{margin:3px 0}
/* Filters */
.filters{background:var(--bg);padding:16px 0 12px;border-bottom:1px solid var(--line);margin-top:12px}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters-row + .filters-row{margin-top:10px}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13.5px}
.filters button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters a{font-size:13px;font-weight:600;padding:10px 6px;display:inline-flex;align-items:center}
.filters label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.filters select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.filter-count{font-size:13px;color:var(--muted);font-weight:600;margin-left:auto}
section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-family:"Fraunces",serif;font-size:30px;margin:0}
.sec-head p{margin:0;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
.kicker{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.cat-world{color:var(--world)}.cat-ai{color:var(--ai)}.cat-econ{color:var(--econ)}
.card h3{font-size:20px;line-height:1.25;margin:8px 0 10px}
.card p{font-size:14.5px;margin:6px 0}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.label:first-of-type{border-top:none;padding-top:0}
.label span{color:var(--accent)}
.dots{letter-spacing:2px}
/* Ratings: importance and confidence kept separate and visible */
.rating-row{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin:12px 0 4px}
@media(max-width:600px){.rating-row{grid-template-columns:1fr}}
.rating-box{border-radius:10px;padding:10px 12px;border:1.5px solid var(--line);background:var(--paper)}
.rating-box .rb-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.rating-box .rb-value{font-size:16px;font-weight:800;margin-top:2px}
.rating-box.conf-high{border-color:var(--good);background:var(--good-bg)}
.rating-box.conf-med{border-color:var(--warn);background:var(--warn-bg)}
.rating-box.conf-low{border-color:var(--low);background:var(--low-bg)}
.rating-box.conf-unv{border-color:var(--bad);background:var(--bad-bg)}
.conf-reason{font-size:12.5px;margin-top:4px;line-height:1.45}
.conf{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--chip)}
.conf.high{color:var(--good)}.conf.med{color:var(--warn)}.conf.unv{color:var(--bad)}
.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:700px){.dates{grid-template-columns:1fr 1fr}}
.datebox{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.datebox b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card ul.facts{margin:6px 0;padding-left:18px;font-size:14.5px}
.card ul.facts li{margin:4px 0}
/* Event clusters */
.cluster{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.subevent{padding:12px 14px;background:var(--paper)}
.subevent + .subevent{border-top:1px solid var(--line)}
.subevent h5{margin:0 0 4px;font-size:14px}
.subevent h5 .sev{color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:12px;margin-right:6px}
.subevent p{font-size:13.5px;margin:0}
.subevent .ev{font-size:12px;color:var(--muted);margin-top:4px}
/* Evidence ladder */
.ladder{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ladder td,.ladder th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.ladder th{background:var(--chip);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.status-yes{font-weight:800;color:var(--good)}.status-no{font-weight:800;color:var(--bad)}.status-part{font-weight:800;color:var(--warn)}
/* Sources prominent */
.sources{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13.5px;background:var(--chip)}
.sources .src-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:8px}
.sources ol{margin:0;padding-left:20px}
.sources li{margin:6px 0}
.sources a{font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:2px 0}
.src-type{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media(max-width:760px){.scenarios{grid-template-columns:1fr}}
.scen{border-radius:12px;padding:16px;border:1px solid var(--line);background:var(--paper)}
.scen h4{margin:0 0 6px}.scen p{font-size:14px;margin:0}
.cross{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.cross{grid-template-columns:1fr}}
.cross-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.cross-item h4{margin:0 0 6px;font-size:15.5px}.cross-item p{margin:0;font-size:14px;color:var(--muted)}
.arrow{font-weight:800;color:var(--accent)}
.watch{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.watch li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 42px;position:relative;font-size:14.5px}
.watch li::before{content:"◉";position:absolute;left:14px;top:12px;color:var(--accent)}
.table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:11px 12px;background:var(--chip);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
@media(max-width:700px){table.data-table,table.data-table thead,table.data-table tbody,table.data-table tr,table.data-table th,table.data-table td{display:block;width:100%}table.data-table thead{display:none}table.data-table tr{border-top:1px solid var(--line);padding:8px 0}table.data-table td{border:none;padding:6px 12px}table.data-table td::before{content:attr(data-l)" — ";font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}}
.tier{font-weight:800}.tier.a{color:var(--good)}
footer{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px}
.hidden{display:none!important}
/* Language switcher — visible but restrained */
.lang-bar{display:flex;gap:6px;align-items:center;margin-top:14px;flex-wrap:wrap}
.lang-bar .lb-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-right:2px}
.lang-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;min-height:36px}
.lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.lang-mini{display:inline-flex;gap:4px;margin-left:8px}
.lang-mini .lang-btn{padding:5px 10px;font-size:12px;min-height:32px}
.en-note{border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;background:var(--paper);font-size:13px;margin-top:14px}
.finding{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.finding h4{margin:0 0 4px;font-size:16.5px;line-height:1.3}
.finding p{font-size:14px;margin:5px 0}
.finding .fmeta{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.finding .fsrc{font-size:12.5px;margin-top:8px}
.finding .fsrc a{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.taxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.taxgrid{grid-template-columns:1fr}}
.taxcol{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px}
.taxcol h4{margin:0 0 6px;font-size:15px}
.taxcol ul{margin:0;padding-left:16px}.taxcol li{margin:3px 0}
.status-tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line)}
.status-tag.est{color:var(--good);background:var(--good-bg)}
.status-tag.hyp{color:var(--warn);background:var(--warn-bg)}
.status-tag.mix{color:var(--low);background:var(--low-bg)}
html[lang="fr"] .rules summary::after{content:"Afficher ▾"}html[lang="fr"] .rules[open ] summary::after{content:"Masquer ▴"}
html[lang="de"] .rules summary::after{content:"Anzeigen ▾"}html[lang="de"] .rules[open ] summary::after{content:"Ausblenden ▴"}
html[lang="zh-CN"] .rules summary::after{content:"展开 ▾"}html[lang="zh-CN"] .rules[open ] summary::after{content:"收起 ▴"}
.none-box{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;background:var(--paper);font-size:14px}

/* Manual theme switcher: html[data-theme] wins over system preference */
html[data-theme="dark"]{--bg:#0f0e0c;--paper:#171512;--ink:#f2ede3;--muted:#a8a195;--line:#2e2a24;--chip:#242019;--card:#1c1a17;--world:#5ec8c0;--ai:#f0a36a;--econ:#8db4ff;--good-bg:#14532d;--warn-bg:#451a03;--low-bg:#431407;--bad-bg:#450a0a;--shadow:0 1px 3px rgba(0,0,0,.4);--good:#4ade80;--warn:#fbbf24;--low:#fb923c;--bad:#f87171;--accent:#f87171}
html[data-theme="light"]{--bg:#f6f3ec;--paper:#fffdf7;--ink:#16130e;--muted:#6b655a;--line:#ddd6c6;--world:#0f4c4c;--ai:#8a3b12;--econ:#1d3a6e;--accent:#b91c1c;--chip:#efe9da;--card:#fff;--good:#166534;--good-bg:#dcfce7;--warn:#92400e;--warn-bg:#fef3c7;--low:#9a3412;--low-bg:#ffedd5;--bad:#991b1b;--bad-bg:#fee2e2;--shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06)}
/* Signal strip in the masthead */
.signal-strip{display:flex;flex-wrap:wrap;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.02em;margin-top:14px}
.stat-chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;white-space:nowrap}
.stat-chip.chip-neg{color:var(--bad);border-color:var(--bad)}
.stat-chip.chip-warn{color:var(--warn);border-color:var(--warn)}
.stat-chip.chip-pos{color:var(--good);border-color:var(--good)}
.signal-strip b{color:var(--accent)}
/* 4-view workspace navigation */
.viewnav{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);padding:12px 0;border-bottom:2px solid var(--ink);margin-top:18px}
.view-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;text-decoration:none;cursor:pointer}
.view-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view-btn:hover{border-color:var(--ink)}
/* Card drawers */
.drawer{margin-top:6px}
.drawer summary{cursor:pointer}
.drawer-summary{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink);margin-top:16px;border-top:1px solid var(--line);padding-top:12px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.drawer-summary::-webkit-details-marker{display:none}
.drawer-summary::after{content:"Show \25be";font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap}
.drawer[open ] .drawer-summary::after{content:"Hide \25b4"}
html[lang="fr"] .drawer-summary::after{content:"Afficher \25be"}
html[lang="de"] .drawer-summary::after{content:"Anzeigen \25be"}
html[lang="zh-CN"] .drawer-summary::after{content:"\5c55\5f00 \25be"}
html[lang="fr"] .drawer[open] .drawer-summary::after{content:"Masquer \25b4"}
html[lang="de"] .drawer[open] .drawer-summary::after{content:"Ausblenden \25b4"}
html[lang="zh-CN"] .drawer[open] .drawer-summary::after{content:"\6536\8d77 \25b4"}
.drawer .sources{margin-top:10px}
.drawer.src-drawer .drawer-summary{border-top:none;margin-top:10px;padding-top:0}
.drawer.src-drawer{margin-top:14px}
/* Deep-dive cross-links */
.deep-link-row{margin:4px 0 0}
.deep-link{display:inline-block;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;text-decoration:none}
.deep-link:hover{border-color:var(--accent);color:var(--accent)}
/* Source tier badges */
.tier-badge{display:inline-block;border-radius:999px;padding:3px 9px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 8px 4px 0;border:1px solid var(--line)}
.tier-badge.tier-primary{color:var(--good);background:var(--good-bg);border-color:var(--good)}
.tier-badge.tier-synd{color:var(--muted);background:var(--chip)}
.tier-badge.tier-index{color:var(--warn);background:var(--warn-bg)}
/* Theme + expand buttons */
.theme-btn{margin-left:auto}
#themeToggle .th-light{display:none}
html[data-theme="dark"] #themeToggle .th-light{display:inline}
html[data-theme="dark"] #themeToggle .th-dark{display:none}

.exp-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13.5px}
#expandToggle span[data-i18n="collapseAll"]{display:none}
#expandToggle.all-expanded span[data-i18n="expandAll"]{display:none}
#expandToggle.all-expanded span[data-i18n="collapseAll"]{display:inline}

/* Domain left-border accents on cards and findings */
article.card[data-cat="world"],.finding[data-cat="world"]{border-left:3px solid var(--world)}
article.card[data-cat="ai"],.finding[data-cat="ai"]{border-left:3px solid var(--ai)}
article.card[data-cat="econ"],.finding[data-cat="econ"]{border-left:3px solid var(--econ)}
/* Drawer summaries invite clicking */
.drawer-summary{transition:background .15s}
.drawer-summary:hover{background:var(--chip);border-radius:8px}
/* Comfortable measure inside wide cards and findings */
article.card p,article.card li,.finding p,.finding li{max-width:72ch}
/* Floating back-to-top button */
#toTop{position:fixed;right:18px;bottom:18px;z-index:30;border:1px solid var(--line);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow)}
#toTop.show{opacity:1;pointer-events:auto}

/* ---- Locked-shell additions (renderer chrome only) ---- */
.load-state{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--chip);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
.load-error{border-color:#b91c1c;background:#fee2e2;color:#991b1b}
html[data-theme="dark"] .load-error{background:#450a0a;color:#f87171;border-color:#7f1d1d}
.archive-wrap{display:inline-flex;gap:6px;align-items:center;margin-left:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#archiveSelect{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-top"><span id="mastTop0"></span><span id="mastTop1"></span></div>
    <div class="brand">WORLD <span>SIGNAL</span></div>
    <p class="tagline" id="tagline"></p>
    <div class="meta-bar" id="metaBar"></div>
    <div class="signal-strip" id="signalStrip"></div>
    <div class="lang-bar">
      <span class="lb-label" id="langLabel">Language</span>
      <button class="lang-btn active" data-lang="en">EN</button><button class="lang-btn" data-lang="fr">FR</button><button class="lang-btn" data-lang="de">DE</button><button class="lang-btn" data-lang="zh">中文</button>
      <button id="themeToggle" class="lang-btn theme-btn"><span class="th-dark">☾ Dark</span><span class="th-light">☀ Light</span></button>
      <span class="archive-wrap"><label for="archiveSelect" id="archiveLabel">Edition</label><select id="archiveSelect"></select></span>
    </div>
    <div id="loadState" class="load-state" hidden>Loading WORLD SIGNAL…</div>
  </header>
  <nav class="viewnav" aria-label="Views"><a class="view-btn active" href="#view=briefing" data-view-link="briefing">Briefing</a><a class="view-btn" href="#view=expanded" data-view-link="expanded">Expanded &amp; Timelines</a><a class="view-btn" href="#view=synthesis" data-view-link="synthesis">Synthesis &amp; Personal</a><a class="view-btn" href="#view=audit" data-view-link="audit">Audit &amp; Methodology</a></nav>
  <nav class="filters" aria-label="Filter developments">
  <div class="filters-row">
    <button class="active" data-f="all">All signals (7)</button>
    <button data-f="world">🌍 WORLD (3)</button>
    <button data-f="ai">◈ AI FRONTIER (3)</button>
    <button data-f="econ">◐ ECONOMY (1)</button>
    <a href="#view=audit&amp;deep=registry">Source Registry ↓</a>
    <a href="#view=audit&amp;deep=reports">Dated Reports ↓</a>
  </div>
  <div class="filters-row">
    <label for="confFilter">Confidence</label>
    <select id="confFilter"><option value="all">All levels</option><option value="high">HIGH</option><option value="medium">MEDIUM</option><option value="low">LOW</option><option value="unverified">UNVERIFIED</option></select>
    <label for="impFilter">Importance</label>
    <select id="impFilter"><option value="all">All ratings</option><option value="5">5 / 5 only</option><option value="4">4 / 5 and above</option><option value="3">3 / 5 and above</option></select>
    <label for="evFilter">Evidence</label>
    <select id="evFilter"><option value="all">Any source count</option><option value="2">2+ independent sources</option><option value="3">3+ independent sources</option></select>
    <button class="exp-btn" id="expandToggle" type="button"><span data-i18n="expandAll">Expand all</span><span data-i18n="collapseAll">Collapse all</span></button><span class="lang-mini" role="group" aria-label="Language"><button class="lang-btn active" data-lang="en">EN</button><button class="lang-btn" data-lang="fr">FR</button><button class="lang-btn" data-lang="de">DE</button><button class="lang-btn" data-lang="zh">中文</button></span>
    <span class="filter-count" id="filterCount">Showing 7 of 7</span>
  </div>
</nav>

  <div id="view-briefing" class="view"></div>
  <div id="view-expanded" class="view hidden"></div>
  <div id="view-synthesis" class="view hidden"></div>
  <div id="view-audit" class="view hidden"></div>
  <footer id="footerEl"></footer>
</div>
<button id="toTop" type="button" aria-label="Back to top">↑ Top</button>
<script>/* WORLD SIGNAL — locked static shell renderer.
   All briefing content lives in ./data/*.json and is fetched at runtime.
   This file holds no briefing content, only rendering logic. */
var WS_LANG = 'en';
try {
  var _saved = localStorage.getItem('ws-lang');
  if (_saved && ['en', 'fr', 'de', 'zh'].indexOf(_saved) !== -1) WS_LANG = _saved;
} catch (e) {}
window.__wsCount = function (shown, total) {
  var t = {en: 'Showing ' + shown + ' of ' + total,
           fr: 'Affichage de ' + shown + ' sur ' + total,
           de: shown + ' von ' + total + ' angezeigt',
           zh: '显示 ' + shown + ' / ' + total + ' 条'};
  return t[WS_LANG] || t.en;
};
var WS_ARCHIVE_LABEL = {en: 'Edition', fr: 'Édition', de: 'Ausgabe', zh: '期数'};
var WS_LANG_LABEL = {en: 'Language', fr: 'Langue', de: 'Sprache', zh: '语言'};
var MANIFEST = null, REGISTRY = null, EDITION = null, CUR_DATE = null;

function $(id) { return document.getElementById(id); }
function L(obj) { return (obj && obj[WS_LANG] !== undefined) ? obj[WS_LANG] : (obj && obj.en); }

async function fetchJSON(path) {
  var r;
  try { r = await fetch(path); }
  catch (e) { throw new Error(path + ' — network error (' + e.message + ')'); }
  if (!r.ok) throw new Error(path + ' — HTTP ' + r.status);
  return r.json();
}

function showLoading(msg) {
  var n = $('loadState'); n.hidden = false; n.className = 'load-state'; n.textContent = msg;
}
function showError(msg) {
  var n = $('loadState'); n.hidden = false; n.className = 'load-state load-error'; n.textContent = msg;
}
function hideLoading() { $('loadState').hidden = true; }

function chipClass(tone) {
  return tone === 'neg' ? 'stat-chip chip-neg' : tone === 'warn' ? 'stat-chip chip-warn' : 'stat-chip';
}

function renderMasthead(ed) {
  $('mastTop0').innerHTML = L(ed.meta.mast_top[0]);
  $('mastTop1').innerHTML = L(ed.meta.mast_top[1]);
  $('tagline').innerHTML = L(ed.meta.tagline);
  $('metaBar').innerHTML = ed.meta.pills.map(function (p) {
    return '<span class="pill">' + L(p) + '</span>';
  }).join('\n    ');
  $('signalStrip').innerHTML = ed.signal_strip.map(function (c) {
    return '<span class="' + chipClass(c.tone) + '">' + c.text + '</span>';
  }).join('\n    ');
}

function renderBriefing(ed) {
  var h = '<div class="exec"><div class="exec-head"><h2>' + L(ed.executive.heading) +
    '</h2><p>' + L(ed.executive.sub) + '</p></div><div class="exec-grid">';
  ed.executive.items.forEach(function (it, i) {
    h += '<div class="' + ed.executive.item_classes[i] + '">' + L(it) + '</div>';
  });
  h += '</div></div>';
  ['world', 'ai', 'econ'].forEach(function (dom) {
    h += '<section id="' + dom + '"><div class="sec-head"><h2>' + L(ed.domain_headings[dom]) +
      '</h2><p>' + L(ed.domain_subs[dom]) + '</p></div><div class="grid">';
    ed.cards.filter(function (c) { return c.domain === dom; }).forEach(function (c) {
      h += '<article class="' + c.cls + '" data-cat="' + c.domain +
        '" data-conf="' + c.confidence + '" data-imp="' + c.importance +
        '" data-sources="' + c.sources + '">' + L(c.html) + '</article>';
    });
    h += '</div></section>';
  });
  $('view-briefing').innerHTML = h;
}

function renderExpanded(ed) {
  var h = '<section id="expanded"><div class="sec-head"><h2>' + L(ed.expanded.heading) +
    '</h2><p>' + L(ed.expanded.sub) + '</p></div>';
  ed.expanded.groups.forEach(function (g) {
    h += '<div class="exp-group" id="' + g.id + '"><h3>' + L(g.heading) + '</h3>';
    g.findings.forEach(function (f) {
      h += '<div class="' + f.cls + '" id="' + f.id + '" data-cat="' + f.data.cat +
        '" data-conf="' + f.data.conf + '" data-imp="' + f.data.imp +
        '" data-sources="' + f.data.sources + '">' + L(f.html) + '</div>';
    });
    h += '</div>';
  });
  h += '</section>';
  h += '<section id="ongoing"><div class="sec-head"><h2>' + L(ed.ongoing.heading) +
    '</h2><p>' + L(ed.ongoing.sub) + '</p></div><ul class="watch">';
  ed.ongoing.items.forEach(function (it) { h += '<li>' + L(it) + '</li>'; });
  h += '</ul></section>';
  $('view-expanded').innerHTML = h;
}

function renderSynthesis(ed) {
  var h = '<section id="connections"><div class="sec-head"><h2>' + L(ed.connections.heading) +
    '</h2><p>' + L(ed.connections.sub) + '</p></div><div class="cross">';
  ed.connections.items.forEach(function (it) { h += '<div>' + L(it) + '</div>'; });
  h += '</div></section>';
  h += '<section id="watchnext"><div class="sec-head"><h2>' + L(ed.watch.heading) +
    '</h2><p>' + L(ed.watch.sub) + '</p></div><ul class="watch">';
  ed.watch.items.forEach(function (it) { h += '<li>' + L(it) + '</li>'; });
  h += '</ul></section>';
  h += '<section id="crossdomain"><div class="sec-head"><h2>' + L(ed.crossdomain.heading) +
    '</h2><p>' + L(ed.crossdomain.sub) + '</p></div><div class="table-wrap">' +
    L(ed.crossdomain.table_html) + '</div></section>';
  h += '<section id="personal"><div class="sec-head"><h2>' + L(ed.personal.heading) +
    '</h2><p>' + L(ed.personal.sub) + '</p></div><div class="cross">';
  ed.personal.items.forEach(function (it) { h += '<div>' + L(it) + '</div>'; });
  h += '</div></section>';
  $('view-synthesis').innerHTML = h;
}

function renderAudit(ed, reg) {
  var h = L(reg.rules_html);
  h += '<section id="assessment" class="' + ed.coverage.cls + '">' + L(ed.coverage.html) + '</section>';
  h += '<section id="taxonomy" class="' + reg.taxonomy.cls + '">' + L(reg.taxonomy.html) + '</section>';
  h += '<section id="gaps" class="' + ed.gaps.cls + '">' + L(ed.gaps.html) + '</section>';
  h += '<section id="registry" class="' + reg.registry.cls + '">' + L(reg.registry.html) + '</section>';
  h += '<section id="glossary" class="' + reg.glossary.cls + '">' + L(reg.glossary.html) + '</section>';
  h += '<section id="reports" class="' + reg.reports.cls + '">' + L(reg.reports.html) + '</section>';
  h += '<section id="revisions" class="' + ed.revisions.cls + '">' + L(ed.revisions.html) + '</section>';
  $('view-audit').innerHTML = h;
}

function renderUI(ed) {
  var ui = ed.ui;
  document.querySelectorAll('.view-btn').forEach(function (b, i) {
    b.textContent = L(ui.nav_labels)[i];
  });
  document.querySelectorAll('.filters button[data-f]').forEach(function (b) {
    var f = b.getAttribute('data-f');
    var cur = b.textContent.match(/\(\d+\)\s*$/);
    b.textContent = L(ui.filter_labels)[f] + ' ' + (cur ? cur[0] : '(0)');
  });
  document.querySelectorAll('.filters a').forEach(function (a, i) {
    a.textContent = L(ui.filter_links)[i];
  });
  ['confFilter', 'impFilter', 'evFilter'].forEach(function (sid) {
    var sel = $(sid);
    if (!sel) return;
    var lab = document.querySelector('label[for="' + sid + '"]');
    if (lab) lab.textContent = L(ui.filter_selects)[sid].label;
    Array.prototype.forEach.call(sel.options, function (o, i) {
      o.textContent = L(ui.filter_selects)[sid].options[i];
    });
  });
  var et = $('expandToggle');
  if (et) {
    et.querySelector('span[data-i18n="expandAll"]').textContent = L(ui.expand_toggle).expand;
    et.querySelector('span[data-i18n="collapseAll"]').textContent = L(ui.expand_toggle).collapse;
  }
  var tt = $('toTop');
  if (tt) tt.textContent = L(ui.to_top);
  var al = $('archiveLabel');
  if (al) al.textContent = WS_ARCHIVE_LABEL[WS_LANG] || 'Edition';
  var ll = $('langLabel');
  if (ll) ll.textContent = WS_LANG_LABEL[WS_LANG] || 'Language';
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-lang') === WS_LANG);
  });
  document.documentElement.setAttribute('lang', WS_LANG === 'zh' ? 'zh-CN' : WS_LANG);
}

function renderAll() {
  renderMasthead(EDITION);
  renderBriefing(EDITION);
  renderExpanded(EDITION);
  renderSynthesis(EDITION);
  renderAudit(EDITION, REGISTRY);
  $('footerEl').innerHTML = L(EDITION.footer_html);
  renderUI(EDITION);
  if (window.__wsApplyFilters) window.__wsApplyFilters();
  window.dispatchEvent(new Event('hashchange'));
}

function setLang(l) {
  if (['en', 'fr', 'de', 'zh'].indexOf(l) === -1) l = 'en';
  WS_LANG = l;
  try { localStorage.setItem('ws-lang', l); } catch (e) {}
  if (EDITION) renderAll();
}

function populateArchive() {
  var sel = $('archiveSelect');
  sel.innerHTML = '';
  MANIFEST.editions.forEach(function (e) {
    var o = document.createElement('option');
    o.value = e.date;
    o.textContent = e.date + ' — ' + e.title;
    if (e.date === CUR_DATE) o.selected = true;
    sel.appendChild(o);
  });
}

async function loadEdition(date) {
  var ed = await fetchJSON('./data/editions/' + date + '.json');
  EDITION = ed;
  CUR_DATE = date;
  renderAll();
  populateArchive();
}

async function init() {
  showLoading('Loading WORLD SIGNAL…');
  try {
    MANIFEST = await fetchJSON('./data/manifest.json');
    REGISTRY = await fetchJSON('./data/registry.json');
    await loadEdition(MANIFEST.latest);
    hideLoading();
  } catch (e) {
    showError('Could not load ' + e.message +
      '. This page fetches its data from ./data/*.json at runtime — ' +
      'please serve it over HTTP (for example the Vercel deployment) ' +
      'instead of opening it directly as a local file.');
  }
}

document.querySelectorAll('.lang-btn[data-lang]').forEach(function (b) {
  b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
});
$('archiveSelect').addEventListener('change', function () {
  var d = this.value;
  showLoading('Loading edition ' + d + '…');
  loadEdition(d).then(hideLoading).catch(function (e) {
    showError('Could not load ' + e.message);
    populateArchive();
  });
});
init();
</script>
<script>
(function(){
  var cat='all';
  var confSel=document.getElementById('confFilter');
  var impSel=document.getElementById('impFilter');
  var evSel=document.getElementById('evFilter');
  var countEl=document.getElementById('filterCount');
  function apply(){
    var scope=document.getElementById('view-'+(window.__wsActiveView||'briefing'));
    var cf=confSel.value, im=impSel.value, ev=evSel.value, shown=0, total=0;
    var items=scope?scope.querySelectorAll('[data-cat]'):[];
    items.forEach(function(c){
      total++;
      var ok=true;
      if(cat!=='all'&&c.getAttribute('data-cat')!==cat)ok=false;
      if(cf!=='all'&&(c.getAttribute('data-conf')||'').split(' ').indexOf(cf)===-1)ok=false;
      if(im!=='all'&&parseInt(c.getAttribute('data-imp'),10)<parseInt(im,10))ok=false;
      if(ev!=='all'&&parseInt(c.getAttribute('data-sources'),10)<parseInt(ev,10))ok=false;
      c.classList.toggle('hidden',!ok);
      if(ok)shown++;
    });
    ['world','ai','econ'].forEach(function(id){var s=document.getElementById(id);if(!s)return;var any=false;s.querySelectorAll('[data-cat]').forEach(function(c){if(!c.classList.contains('hidden'))any=true});s.style.display=any?'':'none'});
    document.querySelectorAll('.exp-group').forEach(function(g){var any=false;g.querySelectorAll('[data-cat]').forEach(function(c){if(!c.classList.contains('hidden'))any=true});g.style.display=any?'':'none'});
    if(countEl)countEl.textContent=window.__wsCount?window.__wsCount(shown,total):'Showing '+shown+' of '+total;
    updateLabels();
  }
  function updateLabels(){
    var counts={all:0,world:0,ai:0,econ:0};
    var scope=document.getElementById('view-'+(window.__wsActiveView||'briefing'));
    if(scope){scope.querySelectorAll('[data-cat]').forEach(function(c){var d=c.getAttribute('data-cat');counts.all++;if(counts[d]!==undefined)counts[d]++;});}
    document.querySelectorAll('.filters button[data-f]').forEach(function(b){
      var f=b.getAttribute('data-f');var n=counts[f];
      if(n===undefined)return;
      b.textContent=b.textContent.replace(/\(\d+\)\s*$/,'('+n+')');
    });
  }
  document.querySelectorAll('.filters button[data-f]').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.filters button[data-f]').forEach(function(x){x.classList.remove('active')});
      b.classList.add('active');cat=b.getAttribute('data-f');apply();
    });
  });
  [confSel,impSel,evSel].forEach(function(s){if(s)s.addEventListener('change',apply)});
  window.__wsApplyFilters=apply;
  apply();
})();
</script>
<script>
(function(){
  /* ---- 4-view workspace routing: #view=briefing|expanded|synthesis|audit [&deep=<id>] ---- */
  var VIEWS=['briefing','expanded','synthesis','audit'];
  function setView(v,deep){
    if(VIEWS.indexOf(v)===-1)v='briefing';
    VIEWS.forEach(function(name){
      var sec=document.getElementById('view-'+name);
      if(sec)sec.classList.toggle('hidden',name!==v);
    });
    document.querySelectorAll('.view-btn').forEach(function(b){
      b.classList.toggle('active',b.getAttribute('data-view-link')===v);
    });
    window.__wsActiveView=v;
    var filtersBar=document.querySelector('.filters');
    if(filtersBar)filtersBar.style.display=(v==='briefing'||v==='expanded')?'':'none';
    if(window.__wsApplyFilters)window.__wsApplyFilters();
    if(deep){
      setTimeout(function(){
        var el=document.getElementById(deep);
        if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}
      },60);
    }else{
      window.scrollTo({top:0,behavior:'smooth'});
    }
  }
  function route(){
    var m=location.hash.match(/view=(\w+)/);
    var d=location.hash.match(/deep=([\w-]+)/);
    setView(m?m[1]:'briefing', d?d[1]:null);
  }
  window.addEventListener('hashchange',route);
  document.querySelectorAll('.view-btn').forEach(function(b){
    b.addEventListener('click',function(){setView(b.getAttribute('data-view-link'),null);});
  });

  /* ---- Manual theme switcher: persisted in localStorage, system default ---- */
  var themeBtn=document.getElementById('themeToggle');
  function applyTheme(t){
    if(t){document.documentElement.setAttribute('data-theme',t);}
    else{document.documentElement.removeAttribute('data-theme');}
  }
  var saved=null;
  try{saved=localStorage.getItem('ws-theme');}catch(e){}
  if(saved==='dark'||saved==='light'){applyTheme(saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){applyTheme('dark');}
  if(themeBtn){themeBtn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=(cur==='dark')?'light':'dark';
    applyTheme(next);
    try{localStorage.setItem('ws-theme',next);}catch(e){}
  });}

  /* ---- Expand All / Collapse All for card drawers ---- */
  var expBtn=document.getElementById('expandToggle');
  if(expBtn){expBtn.addEventListener('click',function(){
    var open=expBtn.classList.toggle('all-expanded');
    document.querySelectorAll('details.drawer').forEach(function(d){d.open=open;});
  });}

  /* ---- Floating back-to-top button ---- */
  var toTop=document.getElementById('toTop');
  if(toTop){
    window.addEventListener('scroll',function(){toTop.classList.toggle('show',window.scrollY>600);},{passive:true});
    toTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  }

  route();
})();
</script>
</body>
</html>
