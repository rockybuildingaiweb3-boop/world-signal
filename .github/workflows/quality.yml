name: Frontend Quality

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "eslint.config.*"
      - ".github/workflows/quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "eslint.config.*"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-signal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit and integration tests
        run: bun run test
      - name: Production build
        run: bun run build